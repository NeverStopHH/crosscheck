version: 2
updates:
  # Bun's manifests are read by the npm ecosystem provider.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per week for routine bumps; security advisories still arrive
      # individually and immediately, which is the point of having this at all.
      dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly