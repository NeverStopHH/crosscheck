# Asks a first-time contributor to accept CLA.md, and records the acceptance.
#
# WHY THIS EXISTS AT ALL: the hub is under FSL-1.1-ALv2, whose whole mechanism is
# that each release converts to Apache-2.0 two years later. Granting licences
# over the combined work requires one party able to grant them. Without a CLA
# every future licensing decision would need every past contributor's agreement,
# and a single unreachable person could freeze the project permanently.
#
# Signatures are stored IN THIS REPOSITORY at .github/cla/signatures.json, not
# with a third party — a contributor can read exactly what was recorded about
# them, in the same place they read the agreement. That is also why this uses the
# action rather than a hosted service.
#
# `pull_request_target` is required, not an oversight: a pull request from a fork
# runs with a read-only token under `pull_request`, and the bot has to write a
# comment and commit a signature file. It is safe here ONLY because this workflow
# never checks out or executes the pull request's code — read the steps below and
# keep it that way. Adding a checkout of `github.event.pull_request.head.sha` to
# this file would hand a fork's code a write token.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA signed
    runs-on: ubuntu-latest
    # Only react to the signing sentence, or to pull-request events themselves.
    if: >-
      (github.event.issue.pull_request
        && contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA'))
      || github.event_name == 'pull_request_target'
    steps:
      # Dependabot cannot agree to a legal document, and its pull requests carry
      # no third-party copyright. Skipping it keeps dependency updates mergeable.
      - uses: contributor-assistant/github-action@v2.6.1
        if: github.actor != 'dependabot[bot]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: .github/cla/signatures.json
          path-to-document: https://github.com/NeverStopHH/crosscheck/blob/main/CLA.md
          branch: main
          allowlist: dependabot[bot]
          custom-notsigned-prcomment: >-
            Thank you for the pull request. Before it can be merged, please read
            [CLA.md](https://github.com/NeverStopHH/crosscheck/blob/main/CLA.md)
            and, if you agree, post the sentence below as a comment. You keep the
            copyright in your work; what this grants is the ability to license the
            combined project, which is what makes the hub's two-year conversion to
            Apache-2.0 possible. Once, ever — later pull requests will not ask again.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'CLA signed — thank you.'
