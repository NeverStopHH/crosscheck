    name: Mutation proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run packages/connector-core/scripts/mutation-check.ts

  cpu-starved:
    # The ACP proxy wedged deterministically on Linux hosts with <= 2
    # effective CPUs (2026-08-19): its idle-direction reads parked on Bun's
    # shared blocking-I/O pool — sized max(2, hardwareConcurrency) — and the
    # three directions pinned the whole pool, so late data, zero-byte stdin
    # EOF and every queued async-fs task were only delivered on a LATER fd
    # event from a different direction. Reads now park on a dedicated thread
    # per direction (connector-acp/src/fd-reader.worker.ts). This lane holds
    # the boundary: the gate probes plus the byte-transparency and
    # backpressure proofs, inside a 2-CPU cgroup, where the defective code
    # was red on every file below that touches the spawned proxy.
    #
    # The file set is the wedge-relevant, git-free subset: the oven/bun
    # image ships no git, which the capture/injection E2E suites shell out
    # to — those run on the full runners in the `test` job. The mechanism
    # itself is ALSO pinned at any core count by pool-starvation.test.ts in
    # every ordinary `bun test` run; this lane is the true-to-life boundary
    # (cpu-starved-e2e.test.ts skips loudly outside it).
    name: ACP proxy on 2 CPUs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Wedge probes + byte proofs inside a 2-CPU cgroup
        run: |
          docker run --rm -v "$PWD":/repo -w /repo --cpus=2 --cpuset-cpus=0,1 oven/bun:1 \
            bun test \
              packages/connector-acp/test/pool-starvation.test.ts \
              packages/connector-acp/test/cpu-starved-e2e.test.ts \
              packages/connector-acp/test/fd-io.test.ts \
              packages/connector-acp/test/transparency.test.ts \
              packages/connector-acp/test/backpressure.test.ts \
              packages/connector-acp/test/proxy-e2e.test.ts

  claims:
    # Every comment in this repo that names a command and says what it prints is
    # run here, and the job fails if any of them is wrong. It exists because
    # three consecutive rounds of auditing that same prose BY HAND each fixed
    # some instances and created others: the measurements were always fine, and
    # what rotted were the quantifiers, the counts and the pointers. Those are
    # cheap for a machine to re-check and expensive for a person to.
    #
    # Both platforms, like the test job and for the same reason: several of the
    # claims are about the runtime's Unicode tables, and two runtimes that
    # disagree would otherwise make one of them quietly wrong.
    name: Comment claims
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run packages/connector-claude/scripts/verify-claims.ts

  secrets:
    # The connector handles per-developer API keys, and one path was already found
    # that could echo one to stderr. Scans history, not just the working tree.
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.28.0 \
            detect --source=/repo --config=/repo/.gitleaks.toml --redact -v