name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # Both platforms, because a green suite only proves correctness for the OS it
    # ran on: an inode-reuse bug was invisible on macOS and reliable on Linux
    # (measured 20/20 vs 0/20 delete+recreate trials), and the team develops on Macs.
    name: Test & Typecheck
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      # Runs on BOTH platforms deliberately: it walks every Unicode
      # Default_Ignorable code point through the briefing renderer, so it is also
      # the check that catches two runtimes disagreeing about the character
      # database. It fails if the set of code points that still reach the reader
      # differs from the set recorded in the script, which is what stops the
      # counts quoted in briefing/sanitize.ts from ageing quietly.
      - run: bun run packages/connector-core/scripts/default-ignorable-sweep.ts

  concurrency:
    # The spool defects in this repo were timing-dependent, surfacing in 3 of 13
    # to 8 of 10 runs when they were found. (HISTORICAL: those rates were
    # measured against the defective code, which is fixed, so nothing in this
    # tree re-derives them.) One green run says little about a race, so the tests
    # that spawn real OS processes run repeatedly. A flake here is a finding,
    # not noise.
    name: Concurrency (repeated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Run the timing-sensitive tests five times
        run: |
          for round in 1 2 3 4 5; do
            echo "::group::round $round"
            bun test \
              packages/connector-core/test/spool-concurrency.test.ts \
              packages/connector-core/test/spool-durability.test.ts \
              packages/connector-claude/test/hook-budget.test.ts
            echo "::endgroup::"
          done

  budgets:
    # Maintenance was once handed a hook's raw remaining time instead of the
    # reserve: against a 350 ms hub with a 600-record backlog, SessionStart went
    # from 640 ms with a briefing to 1035 ms with none, and SessionEnd from
    # 435 ms with the `end` sent to 831 ms with no `end` and no marker.
    # HISTORICAL: those four figures were measured against the shipped defect,
    # which is fixed, so no command here re-derives them. What IS re-runnable is
    # the defect's SHAPE, by re-introducing it — the mutation job below does
    # exactly that, and scripts/measure-ceiling-detection.ts prints the current
    # milliseconds for every variant it re-introduces.
    #
    # RUN ONCE, unlike the concurrency job above, and the difference is the
    # defect. The spool defects were races: they surfaced intermittently (the
    # historical rates are on the concurrency job above, and are not re-derivable
    # either), so repetition is how they get found at all. This one is a CONSTANT —
    # HOOK_RESERVE_RATIO — and a constant is wrong on every run or on none. The
    # mutation job below re-introduces it on every pull request and requires a
    # guard to go red for it, which is a stronger proof of detection than
    # repeating an identical green run.
    #
    # THAT GUARD IS NO LONGER THIS FILE, and it was this runner that proved it
    # could not be. Detection through hook-time-budget.test.ts is a wall-clock
    # SIDE EFFECT — remove the reserve, maintenance eats the hook, the briefing
    # goes missing — so it depends on how slow maintenance is on the host. The
    # mutation job reported the reserve mutation NOT CAUGHT here while catching
    # every other mutation in the same run. The detector is now
    # test/hook-reserve.test.ts, which asserts the subtraction itself against a
    # frozen clock and costs milliseconds. Both files run in this job: the unit
    # one is the detector, this one is the only thing that measures the
    # end-to-end consequence, and neither replaces the other.
    #
    # Repetition here would only have cost. The wall-clock ceilings in this file
    # are the first thing to fail on a starved runner, and they fail there
    # WITHOUT any behavioural assertion failing beside them — so repeating the
    # job would give a flaky assertion several more chances to redden a pull
    # request for no extra signal. The test file's header carries the measured
    # oversubscription sweep and the triage rule derived from it.
    name: Hook budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: |
          bun test \
            packages/connector-claude/test/hook-reserve.test.ts \
            packages/connector-claude/test/hook-time-budget.test.ts

  mutation:
    # A check nobody proved can fail is decoration. This re-introduces the
    # budget-reserve defect, the sanitizer defects the injection corpus guards,
    # the renderer defects the MCP tools' own tests guard and the hub's
    # search-ranking defects its search tests guard, one at a time, and fails
    # if the guarding test stays green. It is what stops those checks from
    # being quietly neutered.
    #
    # The list of defects lives in the script, not here, so the two cannot
    # disagree about how many there are — which they already did once, and did
    # again this round: the per-file breakdown below said `render.ts 1` while
    # the script had grown four MCP renderer mutations, and neither number was
    # written by hand after that.
    #
    # VERIFY: bun -e 'const {MUTATIONS}=await import("./packages/connector-core/scripts/mutation-check.ts");console.log(MUTATIONS.length)'
    # PRINTS: 33
    #
    # Both renderers are covered, and the split is not even — the newer surface
    # prints far more author-written text than the briefing does. Grouping by
    # basename hides that, so the split is its own directive rather than a
    # sentence somebody has to keep in step by hand:
    #
    # VERIFY: bun -e 'const {MUTATIONS}=await import("./packages/connector-core/scripts/mutation-check.ts");const m=new Map();for(const x of MUTATIONS)m.set(x.file,(m.get(x.file)??0)+1);for(const [k,v] of [...m].sort())console.log(k.replace("packages/connector-core/src/","").replace("packages/connector-claude/src/",""),v)'
    # PRINTS: hooks/pre-tool-use.ts 1
    # PRINTS: hooks/stop.ts 1
    # PRINTS: briefing/render.ts 2
    # PRINTS: briefing/sanitize.ts 7
    # PRINTS: constants.ts 4
    # PRINTS: hints/render.ts 1
    # PRINTS: hints/select.ts 4
    # PRINTS: http/hub.ts 1
    # PRINTS: mcp/render-referee.ts 2
    # PRINTS: mcp/render.ts 3
    # PRINTS: packages/server/src/services/hints.ts 1
    # PRINTS: packages/server/src/services/search.ts 6
    #
    # VERIFY: bun -e 'const {MUTATIONS}=await import("./packages/connector-core/scripts/mutation-check.ts");const m=new Map();for(const x of MUTATIONS)m.set(x.file.split("/").pop(),(m.get(x.file.split("/").pop())??0)+1);for(const [k,v] of [...m].sort())console.log(k,v)'
    # PRINTS: constants.ts 4
    # PRINTS: hints.ts 1
    # PRINTS: hub.ts 1
    # PRINTS: pre-tool-use.ts 1
    # PRINTS: render-referee.ts 2
    # PRINTS: render.ts 6
    # PRINTS: sanitize.ts 7
    # PRINTS: search.ts 6
    # PRINTS: select.ts 4
    # PRINTS: stop.ts 1
    name: Mutation proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run packages/connector-core/scripts/mutation-check.ts

  claims:
    # Every comment in this repo that names a command and says what it prints is
    # run here, and the job fails if any of them is wrong. It exists because
    # three consecutive rounds of auditing that same prose BY HAND each fixed
    # some instances and created others: the measurements were always fine, and
    # what rotted were the quantifiers, the counts and the pointers. Those are
    # cheap for a machine to re-check and expensive for a person to.
    #
    # Both platforms, like the test job and for the same reason: several of the
    # claims are about the runtime's Unicode tables, and two runtimes that
    # disagree would otherwise make one of them quietly wrong.
    name: Comment claims
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run packages/connector-claude/scripts/verify-claims.ts

  secrets:
    # The connector handles per-developer API keys, and one path was already found
    # that could echo one to stderr. Scans history, not just the working tree.
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.28.0 \
            detect --source=/repo --config=/repo/.gitleaks.toml --redact -v