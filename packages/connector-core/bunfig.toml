# Test preload: forces ssh identity canonicalization off for the suite so no
# test consults the machine's ~/.ssh/config (see the preload's header). Bun
# reads bunfig.toml from the invocation cwd only — the repo-root copy covers # runs started from the workspace root (CI, mutation-check, verify-claims).
[test]
preload = ["./test/preload.ts"]
