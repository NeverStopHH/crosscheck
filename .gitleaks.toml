# Secret-scanner configuration.
#
# The connector's own secret scanner is tested with one sample of every pattern
# it guards against, so the fixture file necessarily contains strings that look
# exactly like real credentials — that is the point of the test. Allowlisting it
# by path keeps the scanner meaningful everywhere else instead of forcing us to
# weaken the test or disable the scan.
title = "crosscheck"

[extend]
useDefault = true

[[allowlists]]
description = "Fixtures for the connector's own secret detector"
paths = [
  '''packages/connector-core/test/secret-scan\.test\.ts''',
  # The summarizer/promotion tests plant credential-shaped strings to prove
  # the upload scanner refuses them — same class as the file above.
  '''packages/connector-core/test/delivered-store\.test\.ts''',
  '''packages/connector-core/test/review-draft\.test\.ts''',
  '''packages/connector-claude/test/summarizer-worker\.test\.ts''',
  # Same class again, from the knowledge-layer surfaces: the derived-intent
  # worker must DROP a secret-like sentence rather than redact it, and a
  # detached-HEAD fallback title carrying one must lose the whole subject.
  # Both tests have to plant a credential-shaped string to prove the refusal.
  '''packages/connector-claude/test/intent-worker\.test\.ts''',
  '''packages/connector-core/test/session-flows\.test\.ts''',
  # Pre-extraction homes of the three connector-core files above (moved in the
  # Block 1 core extraction). History still carries those blobs at these paths,
  # so a history scan needs the old locations allowlisted too.
  '''packages/connector-claude/test/secret-scan\.test\.ts''',
  '''packages/connector-claude/test/delivered-store\.test\.ts''',
  '''packages/connector-claude/test/review-draft\.test\.ts''',
  # Same class from the 1.0 cut: a backup must not leave a teammate's secret
  # in the work tree, so both tests plant one in the file being rewritten
  # (`LINEAR_API_KEY: "lin_SECRET_123"`) and assert where it does NOT end up.
  '''packages/cli/test/init-backups\.test\.ts''',
  '''packages/cli/test/init-remove-safety\.test\.ts''',
  # A denylisted path shaped like an AWS key id proves the loss ledger never
  # writes a path it was told to drop; the string is the path, not a key.
  '''packages/connector-core/test/capture-losses\.test\.ts''',
  # Authenticator AAGUIDs (iCloud Keychain and the like) are PUBLIC model ids
  # from the FIDO metadata service; the passkey tests name them on purpose.
  '''packages/server/test/passkeys\.test\.ts''',
]

[[allowlists]]
description = "AT-7 canary tokens: a per-run marker, never a credential"
# The behavioral benchmark (docs/1.0/09-behavioral-injection.md) plants
# `at7-` + ten hex characters in every hostile payload and watches for it
# on the canary port and in hub requests; the published report and the
# harness tests carry those markers by design. Matched by shape, so a real
# key under the same field name is still found everywhere.
regexTarget = "secret"
regexes = ['''^at7-[0-9a-f]{10}$''']