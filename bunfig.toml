# Test preloads: the first forces ssh identity canonicalization off for the
# suite so no test consults the machine's ~/.ssh/config, the second refuses
# any fetch that could reach a real hub (127.0.0.1:7100, *.ts.net) — see each
# file's header. Bun reads bunfig.toml from the invocation cwd only — the
# copies in packages/* cover runs started from inside the package.
[test]
preload = ["./packages/connector-core/test/preload.ts", "./packages/connector-core/test/network-guard.ts"]
